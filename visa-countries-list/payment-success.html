<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Successful</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f9;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    /* ── Animated circle & checkmark ── */
    .icon-wrap {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: #e9f9f0;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }

    .checkmark {
      stroke: #22c55e;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      stroke-dasharray: 42;
      stroke-dashoffset: 42;
      animation: draw 0.45s 0.45s ease forwards;
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    /* ── Heading ── */
    .heading {
      text-align: center;
      animation: rise 0.4s 0.65s both;
    }

    .heading h1 {
      font-size: 22px;
      font-weight: 600;
      color: #111827;
    }

    .heading p {
      font-size: 14px;
      color: #6b7280;
      margin-top: 4px;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Amount badge ── */
    .amount-badge {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 0.75rem 2rem;
      text-align: center;
      animation: rise 0.4s 0.75s both;
    }

    .amount-badge .label {
      font-size: 12px;
      color: #16a34a;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .amount-badge .amount {
      font-size: 32px;
      font-weight: 600;
      color: #15803d;
      margin-top: 2px;
    }

    /* ── Details table ── */
    .details {
      width: 100%;
      border: 1px solid #f0f0f0;
      border-radius: 12px;
      overflow: hidden;
      animation: rise 0.4s 0.85s both;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      font-size: 13px;
    }

    .row:not(:last-child) {
      border-bottom: 1px solid #f3f4f6;
    }

    .row .key {
      color: #9ca3af;
      font-weight: 400;
    }

    .row .val {
      color: #111827;
      font-weight: 500;
    }

    /* ── Status pill ── */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #dcfce7;
      color: #16a34a;
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: 999px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
    }

    /* ── Buttons ── */
    .actions {
      display: flex;
      gap: 10px;
      width: 100%;
      animation: rise 0.4s 1s both;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: #22c55e;
      color: #fff;
    }

    .btn-primary:hover {
      background: #16a34a;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    /* ── Footer note ── */
    .footer-note {
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
      animation: rise 0.4s 1.1s both;
    }

    /* ── Confetti ── */
    .confetti-wrap {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .confetti-piece {
      position: absolute;
      top: -12px;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      opacity: 0;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0%   { opacity: 1; transform: translateY(0) rotate(0deg); }
      100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
    }
  </style>

<meta charset="UTF-8">
<title>City One Tourism</title>
</head>
<body>

  <div class="confetti-wrap" id="confetti"></div>

  <div class="card">

    <div class="icon-wrap">
      <svg width="40" height="40" viewBox="0 0 40 40">
        <polyline class="checkmark" points="9,20 17,28 31,12"/>
      </svg>
    </div>

    <div class="heading">
      <h1>Payment Successful!</h1>
      <p>Your transaction has been completed.</p>
    </div>

    <div class="details">
      <div class="row" id="ref-row" style="display:none">
        <span class="key">Reference No.</span>
        <span class="val" id="ref-no"></span>
      </div>
      <div class="row" id="tran-row" style="display:none">
        <span class="key">Transaction Ref</span>
        <span class="val" id="tran-ref"></span>
      </div>
      <div class="row">
        <span class="key">Date &amp; Time</span>
        <span class="val" id="datetime"></span>
      </div>
      <div class="row">
        <span class="key">Status</span>
        <span class="val">
          <span class="status-pill">
            <span class="dot"></span> Success
          </span>
        </span>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" onclick="goHome()" style="flex:1">Done</button>
    </div>

    <p class="footer-note">A confirmation email has been sent to your registered address.</p>

  </div>

  <script>
    // ── Set current date/time ──
    const dtEl = document.getElementById('datetime');
    const now = new Date();
    dtEl.textContent = now.toLocaleString('en-AE', {
      day: '2-digit', month: 'short', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });

    // ── Show reference / transaction id from the URL (?appId=...&tran_ref=...) ──
    const qs = new URLSearchParams(location.search);
    const appId  = qs.get('appId') || qs.get('cart_id') || qs.get('cartId');
    const tranId = qs.get('tran_ref') || qs.get('tranRef');
    if (appId)  { document.getElementById('ref-no').textContent  = appId;  document.getElementById('ref-row').style.display  = 'flex'; }
    if (tranId) { document.getElementById('tran-ref').textContent = tranId; document.getElementById('tran-row').style.display = 'flex'; }

    // ── Confetti ──
    const colors = ['#22c55e','#16a34a','#4ade80','#bbf7d0','#facc15','#60a5fa','#f472b6'];

    function launchConfetti() {
      const wrap = document.getElementById('confetti');
      for (let i = 0; i < 60; i++) {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.width = (8 + Math.random() * 8) + 'px';
        el.style.height = (8 + Math.random() * 8) + 'px';
        el.style.animationDuration = (1.5 + Math.random() * 2) + 's';
        el.style.animationDelay = (Math.random() * 0.8) + 's';
        wrap.appendChild(el);
        el.addEventListener('animationend', () => el.remove());
      }
    }

    launchConfetti();

    // ── Buttons ──
    function goHome() {
      window.location.href = 'https://cityonetours.com/visa.html';
    }
  </script>
